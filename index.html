function displayDate(s){if(!s)return '날짜 선택';const d=parse(s);return `${d.getFullYear()}. ${pad(d.getMonth()+1)}. ${pad(d.getDate())}. (${days[d.getDay()]})`}function displayUntil(s){if(!s)return '날짜 선택';const d=parse(s);return `${d.getFullYear()}. ${pad(d.getMonth()+1)}. ${pad(d.getDate())}.`}function updateDateLabels(){$('dateDisplay').textContent=displayDate($('date').value);$('repeatUntilDisplay').textContent=displayUntil($('repeatUntil').value)+' 까지'}function syncRepeat(){document.querySelectorAll('[data-repeat]').forEach(b=>{const active=b.dataset.repeat===$('repeat').value;b.classList.toggle('selected',active);b.setAttribute('aria-pressed',String(active))});const enabled=$('repeat').value!=='none';$('repeatDateBox').classList.toggle('disabled',!enabled);$('repeatUntil').disabled=!enabled;$('repeatUntil').min=$('date').value||selected; if($('repeatUntil').value&&$('repeatUntil').value<$('repeatUntil').min)$('repeatUntil').value='';updateDateLabels()}$('date').addEventListener('change',syncRepeat);$('repeatUntil').addEventListener('change',updateDateLabels);document.querySelectorAll('[data-repeat]').forEach(b=>b.addEventListener('click',()=>{$('repeat').value=$('repeat').value===b.dataset.repeat?'none':b.dataset.repeat;syncRepeat()}));function openEditor(t=null,preset=null){editing=t?.id||null;editingOccurrence=t?.__occDate||null;catsSelect();$('title').value=t?.title||'';$('date').value=t?.__occDate||t?.date||preset?.date||selected;$('cat').value=t&&data.categories[t.category]?t.category:'개인';$('catdot').style.background=data.categories[$('cat').value];editorStart=t&&!t.allDay?t.start:(preset?.start??defaultStart());editorEnd=t&&!t.allDay?t.end:editorStart+5;if(editorEnd>1560){editorStart=1555;editorEnd=1560}setTimeInputs();$('repeat').value=t?.repeat||'none';$('repeatUntil').value=t?.repeatUntil||'';syncRepeat();$('note').value=t?.note||'';chosenColor=t?.color||data.categories[$('cat').value];chosenIcon=t?.icon||'📋';showAllIcons=false;choices();$('delete').classList.toggle('hidden',!t);open('editOverlay')}
$('start').addEventListener('change',()=>{const n=parseRelative($('start').value,editorStart);if(n===null)return;editorStart=n;editorEnd=n+5;if(editorEnd>1560){editorStart=1555;editorEnd=1560}setTimeInputs()});
$('end').addEventListener('change',()=>{let n=parseRelative($('end').value,editorStart);if(n===null)return;if(n<=editorStart)n+=1440;editorEnd=n;setTimeInputs()});
$('durMinus').onclick=()=>{if(editorEnd-editorStart>5){editorEnd-=5;setTimeInputs()}};$('durPlus').onclick=()=>{if(editorEnd+5<=1560){editorEnd+=5;setTimeInputs()}};
$('focusTitle').onclick=()=>$('title').focus();$('add').onclick=()=>openEditor();$('dockdate').onclick=()=>{selected=planningDay();render(true)};$('cancel').onclick=()=>close('editOverlay');$('cat').onchange=()=>{chosenColor=data.categories[$('cat').value];$('catdot').style.background=chosenColor;choices()};$('moreIcons').onclick=()=>{showAllIcons=!showAllIcons;choices()};
let editingOccurrence=null,choiceAction=null;
function askChoice(title,desc,single,future,futureText){$('choiceTitle').textContent=title;$('choiceDesc').textContent=desc;$('choiceSingle').textContent=single;$('choiceFuture').textContent=futureText;$('choiceFuture').className=title.includes('삭제')?'danger':'soft';choiceAction={single:()=>future(false),future:()=>future(true)};open('choiceOverlay')}
$('choiceCancel').onclick=()=>{choiceAction=null;close('choiceOverlay')};
$('choiceSingle').onclick=()=>{const f=choiceAction?.single;choiceAction=null;close('choiceOverlay');f?.()};
$('choiceFuture').onclick=()=>{const f=choiceAction?.future;choiceAction=null;close('choiceOverlay');f?.()};
function persistEdit(task,old,scope,day){if(!old){data.tasks.push(task)}else if(old.repeat&&old.repeat!=='none'&&scope==='single'){old.overrides??={};old.overrides[day]={title:task.title,start:task.start,end:task.end,category:task.category,color:task.color,icon:task.icon,note:task.note};if(task.date!==day){old.excluded??=[];if(!old.excluded.includes(day))old.excluded.push(day);data.tasks.push({...task,id:'b'+Date.now()+Math.random(),repeat:'none',repeatUntil:null,done:{},overrides:{},excluded:[]})}}else if(old.repeat&&old.repeat!=='none'&&scope==='future'&&day>old.date){const oldEnd=shiftDay(day,-1);const newTask={...task,id:'b'+Date.now()+Math.random(),date:task.date,done:{},excluded:[],overrides:{}};const oldUntil=old.repeatUntil;if(!newTask.repeatUntil)newTask.repeatUntil=oldUntil;if(oldUntil&&newTask.repeatUntil&&newTask.repeatUntil>oldUntil)newTask.repeatUntil=oldUntil;old.repeatUntil=oldEnd;data.tasks.push(newTask)}else{const index=data.tasks.findIndex(t=>t.id===old.id);if(index>=0)data.tasks[index]={...task,done:old.done,excluded:old.excluded||[],overrides:old.overrides||{}}}selected=task.date;save();close('editOverlay');render(true)}
$('form').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim(),day=$('date').value;if(!title||!day)return;const start=editorStart,end=editorEnd;if(start<0||end<=start||end>1560)return alert('시작·종료 시간을 확인해 주세요.');const old=editing?data.tasks.find(t=>t.id===editing):null;const task={id:old?.id||'b'+Date.now()+Math.random().toString(36).slice(2),title,date:day,start,end,allDay:false,category:$('cat').value,color:chosenColor,icon:chosenIcon,repeat:$('repeat').value,repeatUntil:$('repeat').value==='none'?null:($('repeatUntil').value||null),note:$('note').value,done:old?.done||{},created:old?.created||Date.now()};if(old&&old.repeat&&old.repeat!=='none'){const d=editingOccurrence||day;askChoice('반복 일정 수정','변경 내용을 어디에 적용할까요?','이 일정만 수정',null,'이 일정부터 앞으로 모두 수정');choiceAction.single=()=>persistEdit(task,old,'single',d);choiceAction.future=()=>persistEdit(task,old,'future',d)}else persistEdit(task,old,'all',day)};
function requestDelete(t){deleteId=t.__baseId||t.id;const base=data.tasks.find(x=>x.id===deleteId);const day=t.__occDate||selected;if(!base)return;if(base.repeat&&base.repeat!=='none'){askChoice('반복 일정 삭제','선택한 날짜만 지우거나 반복 그룹 전체를 삭제할 수 있어요.','이 일정만 삭제',null,'반복 일정 모두 삭제');choiceAction.single=()=>{base.excluded??=[];if(!base.excluded.includes(day))base.excluded.push(day);if(base.overrides)delete base.overrides[day];save();close('editOverlay');render(false)};choiceAction.future=()=>{if(!confirm('반복된 모든 일정을 삭제할까요?'))return;data.tasks=data.tasks.filter(x=>x.id!==base.id);save();close('editOverlay');render(false)}}else{$('deleteText').textContent=`“${base.title}” 일정을 삭제할까요?`;open('deleteOverlay')}}
$('delete').onclick=()=>{if(!editing)return;const t=list($('date').value).find(x=>x.id===editing)||data.tasks.find(x=>x.id===editing);requestDelete(t)};
$('confirmDelete').onclick=()=>{data.tasks=data.tasks.filter(t=>t.id!==deleteId);save();close('deleteOverlay');close('editOverlay');render(false)};
$('settingsLogo').onclick=()=>open('settingsOverlay');$('catsBtn').onclick=()=>{close('settingsOverlay');renderCats();open('catsOverlay')};
function renderCats(){const el=$('catlist');el.replaceChildren();const names=Object.keys(data.categories);names.forEach((name,i)=>{const row=document.createElement('div');row.className='catrow';const picker=document.createElement('input');picker.type='color';picker.value=data.categories[name];picker.setAttribute('aria-label',name+' 색상');picker.onchange=()=>{data.categories[name]=picker.value;save();render(false)};const label=document.createElement('span');label.className='catname';label.textContent=name;row.append(picker,label);if(name!=='기타'){const del=document.createElement('button');del.className='deletecat';del.textContent='×';del.setAttribute('aria-label',name+' 삭제');del.onclick=()=>{if(!confirm('“'+name+'” 카테고리를 삭제할까요?'))return;data.tasks.forEach(t=>{if(t.category===name)t.category='기타'});delete data.categories[name];save();renderCats();render(false)};row.append(del)}const move=document.createElement('div');move.className='move';for(const [delta,icon] of [[-1,'▲'],[1,'▼']]){const b=document.createElement('button');b.textContent=icon;b.disabled=i+delta<0||i+delta>=names.length;b.setAttribute('aria-label',name+(delta<0?' 위로':' 아래로'));b.onclick=()=>{const ns=[...Object.keys(data.categories)];[ns[i],ns[i+delta]]=[ns[i+delta],ns[i]];data.categories=Object.fromEntries(ns.map(n=>[n,data.categories[n]]));save();renderCats()};move.append(b)}row.append(move);el.append(row)})}
$('pickcolor').onclick=()=>$('newcolor').click();$('addcat').onclick=()=>{const name=$('newcat').value.trim();if(!name)return alert('카테고리 이름을 입력해 주세요.');if(data.categories[name])return alert('이미 있는 카테고리예요.');data.categories[name]=$('newcolor').value;$('newcat').value='';save();renderCats()};
$('backup').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Builday-backup-'+key(new Date())+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)};
$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj||!Array.isArray(obj.tasks))throw Error('invalid');if(!confirm('현재 일정을 백업 데이터로 교체할까요?'))return;data={tasks:obj.tasks,categories:{...CATS,...obj.categories}};save();close('settingsOverlay');render(true);notify('복원 완료')}catch{alert('올바른 Builday 백업 파일이 아니에요.')}finally{e.target.value=''}};
render(true);setInterval(()=>{if(!document.querySelector('.overlay.open'))render(false)},60000);
</script></body></html>
