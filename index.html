const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},shiftDay=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return key(d)},days=['일','월','화','수','목','금','토'];

for(const t of items){if(!t.allDay){if(isToday&&!nowShown&&now<=t.start&&(!items.some(x=>!x.allDay&&x.start<now&&x.end>now)))insertNow();if(prevEnd!==null&&t.start>prevEnd){const g=document.createElement('div');g.className='gapline';const delta=t.start-prevEnd,icon=delta<=5?'clock':delta<=15?'coffee':delta<=30?'leaf':'smile';g.innerHTML=svg(icon);const span=document.createElement('span');span.textContent=duration(delta)+'의 여유';g.append(span);tl.append(g)}if(isToday&&!nowShown&&now>=t.start&&now<t.end)insertNow()}
const row=document.createElement('div');row.className='item';const done=!!t.done?.[selected],ic=document.createElement('button');ic.className='complete'+(done?' done':'');ic.style.background=done?'#e7e7e9':(t.color||'#e9e2ff')+'35';ic.textContent=t.icon||'📋';ic.setAttribute('aria-label',done?'완료 취소':'완료 표시');ic.onclick=()=>{t.done??={};t.done[selected]?delete t.done[selected]:t.done[selected]=true;updateTask(t)};
const card=document.createElement('div');card.className='event'+(done?' done':'');card.style.setProperty('--event-color',t.color||'#bba6ee');const body=document.createElement('div');body.className='bodytap';body.setAttribute('role','button');body.tabIndex=0;body.setAttribute('aria-label',t.title+' 수정');body.onclick=()=>openEditor(t);body.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openEditor(t)}};const when=document.createElement('div');when.className='when';when.textContent=t.allDay?'시간 미지정':`${clock(t.start)} ~ ${clock(t.end)} (${duration(t.end-t.start)})`;const wrap=document.createElement('div');wrap.className='namewrap';const name=document.createElement('span');name.className='taskname';name.textContent=t.title;wrap.append(name);if(t.note){const memo=document.createElement('span');memo.className='taskmemo';memo.textContent=t.note;wrap.append(memo)}body.append(when,wrap);
const ctr=document.createElement('div');ctr.className='controls';const alarm=document.createElement('button');alarm.className='alarm'+(t.alarm?' active':'');alarm.setAttribute('aria-label',`알림 ${t.alarm||'꺼짐'}, 다음 설정으로 변경`);alarm.innerHTML=svg('bell');if(t.alarm){const mins=document.createElement('span');mins.className='minutes';mins.textContent=t.alarm;alarm.append(mins)}alarm.onclick=()=>{const seq=[0,3,5,15];t.alarm=seq[(seq.indexOf(t.alarm||0)+1)%4];updateTask(t);notify(t.alarm?`${t.alarm}분 전 알림 설정 · 앱 실행 중에만 점검`:'알림 꺼짐')};
const shift=document.createElement('div');shift.className='shift';for(const [delta,symbol,desc] of [[-5,'up','5분 앞당기기'],[5,'down','5분 미루기']]){const b=document.createElement('button');b.innerHTML=svg(symbol);b.setAttribute('aria-label',desc);b.disabled=t.allDay||t.start+delta<0||t.end+delta>1560;b.onclick=()=>{t.start+=delta;t.end+=delta;updateTask(t)};shift.append(b)}ctr.append(alarm,shift);card.append(body,ctr);row.append(ic,card);tl.append(row);
let timer=null,held=false,px=0,py=0;row.addEventListener('touchstart',e=>{if(e.target.closest('button'))return;held=false;px=e.touches[0].clientX;py=e.touches[0].clientY;timer=setTimeout(()=>{held=true;deleteId=t.id;$('deleteText').textContent=`“${t.title}” 일정을 삭제할까요?`;open('deleteOverlay');navigator.vibrate?.(15)},650)},{passive:true});row.addEventListener('touchmove',e=>{if(Math.abs(e.touches[0].clientX-px)>10||Math.abs(e.touches[0].clientY-py)>10)clearTimeout(timer)},{passive:true});row.addEventListener('touchend',()=>clearTimeout(timer));row.addEventListener('touchcancel',()=>clearTimeout(timer));body.addEventListener('contextmenu',e=>{e.preventDefault();deleteId=t.id;$('deleteText').textContent=`“${t.title}” 일정을 삭제할까요?`;open('deleteOverlay')});body.addEventListener('click',e=>{if(held){e.stopImmediatePropagation();held=false}},true);if(!t.allDay)prevEnd=prevEnd===null?t.end:Math.max(prevEnd,t.end)}if(isToday&&!nowShown)insertNow();if(rebuildStrip)buildStrip()}
function catsSelect(){const el=$('cat');el.replaceChildren();for(const c of Object.keys(data.categories)){const o=document.createElement('option');o.value=c;o.textContent=c;el.append(o)}}
function choices(){const el=$('colors');el.replaceChildren();for(const c of PALETTE){const b=document.createElement('button');b.type='button';b.style.background=c;b.className=c===chosenColor?'chosen':'';b.setAttribute('aria-label','색상 '+c);b.onclick=()=>{chosenColor=c;choices()};el.append(b)}const box=$('icons');box.replaceChildren();const visible=showAllIcons?[...ICONS]:ICONS.slice(0,10);if(!visible.includes(chosenIcon))visible.push(chosenIcon);for(const i of visible){const b=document.createElement('button');b.type='button';b.textContent=i;b.className=i===chosenIcon?'chosen':'';b.onclick=()=>{chosenIcon=i;choices()};box.append(b)}$('moreIcons').textContent=showAllIcons?'−':'+';$('moreIcons').setAttribute('aria-label',showAllIcons?'아이콘 접기':'아이콘 더 보기')}
function defaultStart(){const existing=list(selected).filter(t=>!t.allDay);if(existing.length){const last=[...existing].sort((a,b)=>(b.created||0)-(a.created||0))[0];return Math.min(last.end,1555)}if(selected===planningDay()){const now=new Date();let m=now.getHours()*60+now.getMinutes();if(m<120)m+=1440;return Math.min(Math.floor(m/60+1)*60,1555)}return 540}
function updateDuration(){const d=editorEnd-editorStart;$('durValue').textContent=duration(Math.max(0,d));$('durMinus').disabled=d<=5;$('durPlus').disabled=editorEnd+5>1560}
function setTimeInputs(){ $('start').value=clock(editorStart);$('end').value=clock(editorEnd);updateDuration()}
function parseRelative(s,anchor){let n=minutes(s);if(n===null)return null;if(anchor>=1440&&n<120)n+=1440;return n}
function openEditor(t=null){editing=t?.id||null;catsSelect();$('title').value=t?.title||'';$('date').value=t?.date||selected;$('cat').value=t&&data.categories[t.category]?t.category:'개인';$('catdot').style.background=data.categories[$('cat').value];editorStart=t&&!t.allDay?t.start:defaultStart();editorEnd=t&&!t.allDay?t.end:editorStart+5;if(editorEnd>1560){editorStart=1555;editorEnd=1560}setTimeInputs();$('repeat').value=t?.repeat||'none';$('note').value=t?.note||'';chosenColor=t?.color||data.categories[$('cat').value];chosenIcon=t?.icon||'📋';showAllIcons=false;choices();$('delete').classList.toggle('hidden',!t);open('editOverlay')}
$('start').addEventListener('change',()=>{const n=parseRelative($('start').value,editorStart);if(n===null)return;editorStart=n;editorEnd=n+5;if(editorEnd>1560){editorStart=1555;editorEnd=1560}setTimeInputs()});
$('end').addEventListener('change',()=>{let n=parseRelative($('end').value,editorStart);if(n===null)return;if(n<=editorStart)n+=1440;editorEnd=n;updateDuration()});
$('durMinus').onclick=()=>{if(editorEnd-editorStart>5){editorEnd-=5;setTimeInputs()}};$('durPlus').onclick=()=>{if(editorEnd+5<=1560){editorEnd+=5;setTimeInputs()}};
$('add').onclick=()=>openEditor();$('today').onclick=()=>{selected=planningDay();render(true)};$('cancel').onclick=()=>close('editOverlay');$('cat').onchange=()=>{chosenColor=data.categories[$('cat').value];$('catdot').style.background=chosenColor;choices()};$('moreIcons').onclick=()=>{showAllIcons=!showAllIcons;choices()};
$('form').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim(),day=$('date').value;if(!title||!day)return;const start=editorStart,end=editorEnd;if(start<0||end<=start||end>1560)return alert('시작·종료 시간을 확인해 주세요. (다음 날 새벽 2시까지)');const old=editing?data.tasks.find(t=>t.id===editing):null;const task={id:old?.id||'b'+Date.now()+Math.random().toString(36).slice(2),title,date:day,start,end,allDay:false,category:$('cat').value,color:chosenColor,icon:chosenIcon,repeat:$('repeat').value,note:$('note').value,alarm:old?.alarm||0,done:old?.done||{},created:old?.created||Date.now()};if(old)data.tasks[data.tasks.indexOf(old)]=task;else data.tasks.push(task);selected=day;save();close('editOverlay');render(true)};
$('delete').onclick=()=>{if(!editing)return;deleteId=editing;$('deleteText').textContent='이 일정을 삭제할까요?';close('editOverlay');open('deleteOverlay')};$('confirmDelete').onclick=()=>{data.tasks=data.tasks.filter(t=>t.id!==deleteId);save();close('deleteOverlay');render(false)};
$('settings').onclick=()=>open('settingsOverlay');$('catsBtn').onclick=()=>{close('settingsOverlay');renderCats();open('catsOverlay')};
function renderCats(){const el=$('catlist');el.replaceChildren();const names=Object.keys(data.categories);names.forEach((name,i)=>{const row=document.createElement('div');row.className='catrow';const picker=document.createElement('input');picker.type='color';picker.value=data.categories[name];picker.setAttribute('aria-label',name+' 색상');picker.onchange=()=>{data.categories[name]=picker.value;save();render(false)};const label=document.createElement('span');label.className='catname';label.textContent=name;row.append(picker,label);if(name!=='기타'){const del=document.createElement('button');del.className='deletecat';del.textContent='×';del.setAttribute('aria-label',name+' 삭제');del.onclick=()=>{if(!confirm('“'+name+'” 카테고리를 삭제할까요?'))return;data.tasks.forEach(t=>{if(t.category===name)t.category='기타'});delete data.categories[name];save();renderCats();render(false)};row.append(del)}const move=document.createElement('div');move.className='move';for(const [delta,icon] of [[-1,'▲'],[1,'▼']]){const b=document.createElement('button');b.textContent=icon;b.disabled=i+delta<0||i+delta>=names.length;b.setAttribute('aria-label',name+(delta<0?' 위로':' 아래로'));b.onclick=()=>{const ns=[...Object.keys(data.categories)];[ns[i],ns[i+delta]]=[ns[i+delta],ns[i]];data.categories=Object.fromEntries(ns.map(n=>[n,data.categories[n]]));save();renderCats()};move.append(b)}row.append(move);el.append(row)})}
$('pickcolor').onclick=()=>$('newcolor').click();$('addcat').onclick=()=>{const name=$('newcat').value.trim();if(!name)return alert('카테고리 이름을 입력해 주세요.');if(data.categories[name])return alert('이미 있는 카테고리예요.');data.categories[name]=$('newcolor').value;$('newcat').value='';save();renderCats()};
$('backup').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Builday-backup-'+key(new Date())+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)};
$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj||!Array.isArray(obj.tasks))throw Error('invalid');if(!confirm('현재 일정을 백업 데이터로 교체할까요?'))return;data={tasks:obj.tasks,categories:{...CATS,...obj.categories}};save();close('settingsOverlay');render(true);notify('복원 완료')}catch{alert('올바른 Builday 백업 파일이 아니에요.')}finally{e.target.value=''}};
$('permission').onclick=async()=>{if(!('Notification'in window)){notify('이 브라우저는 알림 API를 지원하지 않아요');return}try{const result=await Notification.requestPermission();notify(result==='granted'?'알림 권한 허용됨':'알림 권한이 허용되지 않았어요')}catch{notify('알림 권한을 요청할 수 없어요')}};
function checkReminders(){if(!('Notification'in window)||Notification.permission!=='granted')return;const now=new Date(),today=planningDay(now),m=currentMinutes();for(const t of list(today)){if(t.allDay||!t.alarm)continue;const target=t.start-t.alarm;if(m<target||m>target+1)continue;const id=t.id+'-'+today+'-'+target;if(notificationsSeen.has(id))continue;notificationsSeen.add(id);try{new Notification('Builday · '+t.title,{body:`${t.alarm}분 후 일정이 시작돼요`})}catch{}}}
render(true);setInterval(()=>{if(!document.querySelector('.overlay.open'))render(false);checkReminders()},60000);checkReminders();
</script></body></html>
